[project]
name = "blackjax-utils"
version = "0.2.1"
description = "Functions for running MCMC with blackJAX"
readme = "README.md"
authors = [
    { name = "Teddy Groves", email = "groves.teddy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "blackjax>=1.3",
    "jaxtyping>=0.3.5",
]

[project.scripts]
blackjax-utils = "blackjax_utils:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "diffrax>=0.7.2",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.3.0",
]

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmark bodies still run once each, so they cannot rot, but no timings are
# collected. Measure with: pytest tests/test_benchmarks.py --benchmark-enable
addopts = "--benchmark-disable"
